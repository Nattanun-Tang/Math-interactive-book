<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>ค่าความจริงของประโยคที่มีตัวบ่งปริมาณตัวเดียว | Interactive Mathematics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script defer src="content.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <div class="site-shell">
    <section id="landingPage" class="view view--active landing" aria-labelledby="landingTitle">
      <div class="landing__frame">
        <div class="landing__copy">
          <p id="landingEyebrow" class="eyebrow">INTERACTIVE MATHEMATICS</p>
          <div class="landing__title-block">
            <h1 id="landingTitle" class="landing__title">ค่าความจริงของประโยค<br>ที่มีตัวบ่งปริมาณตัวเดียว</h1>
            <button id="startButton" class="primary-button landing__start" type="button">เริ่ม</button>
          </div>
        </div>
        <div class="landing__visual" aria-hidden="true">
          <img
            class="landing__visual-image"
            src="../../452493_0.jpg"
            alt=""
            width="1024"
            height="437"
            decoding="async"
            onerror="this.hidden=true;this.parentElement?.classList.add('landing__visual--empty');"
          >
        </div>
      </div>
    </section>

    <section id="appPage" class="view app-page" aria-labelledby="appTitle" hidden>
      <div class="app-main-card">
        <header class="app-header">
          <h1 id="appTitle" class="app-header__title" tabindex="-1">ค่าความจริงของประโยคที่มีตัวบ่งปริมาณตัวเดียว</h1>
        </header>

        <main id="contentGrid" class="app-content">
          <div id="appLayout" class="app-layout quant-app">
            <div class="quant-toolbar">
              <p id="questionLabel" class="quant-toolbar__label">ข้อ 1/10</p>
              <div class="quant-toolbar__right">
                <button id="infoBtn" class="info-btn" type="button" aria-label="ความหมาย" title="ความหมาย">
                  <span class="info-btn__glyph" aria-hidden="true">i</span>
                </button>
              </div>
            </div>

            <div class="quant-nav" aria-label="เลือกข้อ">
              <div class="quant-nav__dots" role="group" aria-label="เลื่อนข้อ">
                <button id="prevQuestionBtn" class="nav-arrow" type="button" aria-label="ข้อก่อนหน้า">&lt;</button>
                <div id="questionDots" class="question-dots"></div>
                <button id="nextQuestionBtn" class="nav-arrow" type="button" aria-label="ข้อถัดไป">&gt;</button>
              </div>
            </div>

            <div id="promptBox" class="prompt-box" aria-live="polite"></div>

            <section class="work-panel answer-panel" aria-label="เลือกค่าความจริง">
              <p id="answerPrompt" class="answer-prompt">ประโยคนี้มีค่าความจริงเป็น</p>
              <div id="choiceGroup" class="choice-group" role="radiogroup" aria-labelledby="answerPrompt">
                <button type="button" class="choice-btn" data-value="T" role="radio" aria-checked="false">จริง</button>
                <button type="button" class="choice-btn" data-value="F" role="radio" aria-checked="false">เท็จ</button>
              </div>

              <div id="solutionBox" class="solution-box" hidden>
                <p class="solution-box__title">วิธีทำ</p>
                <div id="solutionBody" class="solution-box__body"></div>
              </div>

              <div class="panel-actions">
                <p id="resultLine" class="result-line" hidden></p>
                <p id="checkPopup" class="check-popup" role="alert" hidden>เลือกคำตอบก่อน</p>
                <button id="checkBtn" class="action-btn action-btn--accent" type="button">ตรวจสอบ</button>
                <button id="revealBtn" class="action-btn action-btn--accent" type="button">เฉลย</button>
              </div>
            </section>
          </div>
        </main>
      </div>
    </section>
  </div>

  <div id="defModal" class="modal" hidden>
    <div class="modal__backdrop" data-close="def"></div>
    <div class="modal__card modal__card--def" role="dialog" aria-modal="true" aria-labelledby="defModalTitle">
      <button id="defCloseBtn" class="modal__close" type="button" aria-label="ปิด">&times;</button>
      <p id="defModalTitle" class="modal__title visually-hidden">ความหมาย</p>
      <div id="defModalBody" class="modal__body"></div>
    </div>
  </div>
</body>
</html>
