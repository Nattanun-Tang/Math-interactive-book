<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>การเชื่อมประพจน์ | Interactive Mathematics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script defer src="content.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <div class="site-shell">
    <section id="landingPage" class="view view--active landing" aria-labelledby="landingTitle">
      <div class="landing__frame">
        <div class="landing__copy">
          <p id="landingEyebrow" class="eyebrow">INTERACTIVE MATHEMATICS</p>
          <div class="landing__title-block">
            <h1 id="landingTitle" class="landing__title">การเชื่อมประพจน์</h1>
            <button id="startButton" class="primary-button landing__start" type="button">เริ่ม</button>
          </div>
        </div>
        <div class="landing__visual" aria-hidden="true">
          <img
            class="landing__visual-image"
            src="../../452493_0.jpg"
            alt=""
            width="660"
            height="720"
            decoding="async"
            onerror="this.hidden=true;this.parentElement?.classList.add('landing__visual--empty');"
          >
        </div>
      </div>
    </section>

    <section id="appPage" class="view app-page" aria-labelledby="appTitle" hidden>
      <div class="app-main-card">
        <header class="app-header">
          <h1 id="appTitle" class="app-header__title" tabindex="-1">การเชื่อมประพจน์</h1>
        </header>

        <main id="contentGrid" class="app-content">
          <div id="appLayout" class="app-layout logic-app is-study-mode">
            <div class="logic-controls" role="group" aria-label="ตั้งค่า">
              <div class="logic-control">
                <span id="modeLabel" class="logic-control__label">โหมด</span>
                <div id="modeToggle" class="seg" role="radiogroup" aria-labelledby="modeLabel">
                  <button type="button" class="seg__btn is-active" data-mode="study" role="radio" aria-checked="true">ศึกษา</button>
                  <button type="button" class="seg__btn" data-mode="test" role="radio" aria-checked="false">ทดสอบ</button>
                </div>
              </div>

              <div id="connectiveControl" class="logic-control logic-control--op">
                <label id="connectiveLabel" class="logic-control__label" for="connectiveSelect">ตัวเชื่อมประพจน์</label>
                <select id="connectiveSelect" class="logic-select" aria-labelledby="connectiveLabel"></select>
              </div>
            </div>

            <section id="studyPanel" class="study-panel" aria-live="polite">
              <div id="definitionBox" class="study-definition"></div>
              <div class="study-table-wrap">
                <table id="truthTable" class="truth-table" aria-label="ตารางค่าความจริง"></table>
              </div>
              <div id="tipBox" class="study-tip"></div>
            </section>

            <section id="testPanel" class="test-panel" hidden>
              <div class="test-builder" aria-label="สร้างนิพจน์ด้วยแผ่นป้าย">
                <p id="tilesLabel" class="tiles-label">สร้างนิพจน์ด้วยแผ่นป้าย</p>
                <div id="tilePalette" class="tile-palette" role="group" aria-labelledby="tilesLabel"></div>

                <div class="expr-bar">
                  <p id="exprError" class="expr-error" role="alert" hidden>เขียนนิพจน์ไม่ถูกต้องตามหลักการ</p>
                  <div class="expr-bar__body">
                    <div class="expr-bar__line">
                      <span id="exprLabel" class="expr-bar__label">นิพจน์ :</span>
                      <div id="exprLine" class="expr-line" role="list" aria-labelledby="exprLabel"></div>
                    </div>
                    <div class="expr-bar__actions">
                      <button id="exprBackspace" class="expr-icon-btn" type="button" aria-label="ลบ" title="ลบ">
                        <svg class="expr-icon-btn__svg" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                          <path d="M8.5 5.5H20a1.5 1.5 0 0 1 1.5 1.5v10A1.5 1.5 0 0 1 20 18.5H8.5L3.2 12.8a1.2 1.2 0 0 1 0-1.6L8.5 5.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                          <path d="M11.2 9.2l5.6 5.6M16.8 9.2l-5.6 5.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                        </svg>
                      </button>
                      <button id="exprClear" class="expr-icon-btn" type="button" aria-label="ล้างนิพจน์" title="ล้างนิพจน์">
                        <span class="expr-icon-btn__letter" aria-hidden="true">C</span>
                      </button>
                      <button id="exprShowBtn" class="expr-show-btn" type="button">สร้าง</button>
                    </div>
                  </div>
                </div>
              </div>

              <section id="exercisePanel" class="exercise-panel" hidden aria-label="แบบฝึกหัดค่าความจริง">
                <button id="exerciseReset" class="stage-reset" type="button" aria-label="รีเฟรช" title="รีเฟรช">
                  <svg class="stage-reset__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                    <path d="M21 12a9 9 0 1 1-3-6.7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M21 3v6h-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
                <p id="exerciseHint" class="exercise-hint"></p>
                <div id="assignRow" class="assign-row"></div>
                <div id="treeStage" class="tree-stage"></div>
                <div class="exercise-actions">
                  <p id="checkPopup" class="check-popup" role="alert" hidden>เติมคำตอบให้ครบถ้วน</p>
                  <button id="checkBtn" class="check-btn" type="button">ตรวจสอบ</button>
                </div>
              </section>
            </section>
          </div>
        </main>
      </div>
    </section>
  </div>
</body>
</html>
