<svg xmlns="http://www.w3.org/2000/svg" width="660" height="720" viewBox="0 0 660 720" role="img" aria-hidden="true">
  <defs>
    <clipPath id="landClipU">
      <rect x="42" y="36" width="576" height="486" rx="16"/>
    </clipPath>
    <clipPath id="landClipA">
      <circle cx="260" cy="222" r="137"/>
    </clipPath>
    <clipPath id="landClipB">
      <circle cx="399" cy="222" r="137"/>
    </clipPath>
    <clipPath id="landClipC">
      <circle cx="330" cy="326" r="137"/>
    </clipPath>
    <mask id="landMaskNotB">
      <rect x="42" y="36" width="576" height="486" fill="#fff"/>
      <circle cx="399" cy="222" r="137" fill="#000"/>
    </mask>
    <mask id="landMaskNotC">
      <rect x="42" y="36" width="576" height="486" fill="#fff"/>
      <circle cx="330" cy="326" r="137" fill="#000"/>
    </mask>
    <filter id="landSoft" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#18202a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="660" height="720" fill="#ffffff"/>

  <!-- Diagram card -->
  <g filter="url(#landSoft)">
    <rect x="42" y="36" width="576" height="486" rx="16" fill="#ffffff" stroke="#5e6b78" stroke-width="3"/>
  </g>

  <g clip-path="url(#landClipU)">
    <!-- A ∩ B − C -->
    <g clip-path="url(#landClipA)">
      <g clip-path="url(#landClipB)">
        <g mask="url(#landMaskNotC)">
          <rect x="42" y="36" width="576" height="486" fill="#f5c9a8"/>
        </g>
      </g>
    </g>
    <!-- A ∩ C − B -->
    <g clip-path="url(#landClipA)">
      <g clip-path="url(#landClipC)">
        <g mask="url(#landMaskNotB)">
          <rect x="42" y="36" width="576" height="486" fill="#a8c6f0"/>
        </g>
      </g>
    </g>
    <!-- A ∩ B ∩ C -->
    <g clip-path="url(#landClipA)">
      <g clip-path="url(#landClipB)">
        <g clip-path="url(#landClipC)">
          <rect x="42" y="36" width="576" height="486" fill="#f0e090"/>
        </g>
      </g>
    </g>
  </g>

  <circle cx="260" cy="222" r="137" fill="none" stroke="#2f3b4a" stroke-width="4"/>
  <circle cx="399" cy="222" r="137" fill="none" stroke="#2f3b4a" stroke-width="4"/>
  <circle cx="330" cy="326" r="137" fill="none" stroke="#2f3b4a" stroke-width="4"/>

  <text x="63" y="78" fill="#18202a" font-family="KaTeX_Math, 'Times New Roman', Times, serif" font-size="34" font-style="italic">U</text>
  <text x="148" y="198" text-anchor="middle" dominant-baseline="middle" fill="#18202a" font-family="KaTeX_Math, 'Times New Roman', Times, serif" font-size="34" font-style="italic" stroke="#ffffff" stroke-width="5" paint-order="stroke fill">A</text>
  <text x="511" y="198" text-anchor="middle" dominant-baseline="middle" fill="#18202a" font-family="KaTeX_Math, 'Times New Roman', Times, serif" font-size="34" font-style="italic" stroke="#ffffff" stroke-width="5" paint-order="stroke fill">B</text>
  <text x="330" y="486" text-anchor="middle" dominant-baseline="middle" fill="#18202a" font-family="KaTeX_Math, 'Times New Roman', Times, serif" font-size="34" font-style="italic" stroke="#ffffff" stroke-width="5" paint-order="stroke fill">C</text>

  <!-- Caption -->
  <rect x="42" y="548" width="576" height="140" rx="10" fill="#e9eef2" stroke="#c8d0d8" stroke-width="1.5"/>
  <text x="330" y="602" text-anchor="middle" fill="#18202a" font-family="Sarabun, 'TH Sarabun New', Arial, sans-serif" font-size="28" font-weight="700">เขียนเซตจากพื้นที่แรเงาได้เป็น</text>
  <text x="330" y="654" text-anchor="middle" fill="#18202a" font-family="KaTeX_Main, 'Times New Roman', Times, serif" font-size="36">A &#8745; (B &#8746; C)</text>
</svg>
