<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>พื้นที่แรเงาบนแผนภาพเวนน์</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="content.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <div class="site-shell">
    <section id="landingPage" class="view view--active landing" aria-labelledby="landingTitle">
      <div class="landing__frame">
        <div class="landing__copy">
          <p id="landingEyebrow" class="eyebrow">INTERACTIVE MATHEMATICS</p>
          <h1 id="landingTitle" class="landing__title">พื้นที่แรเงาบนแผนภาพเวนน์</h1>
          <button id="startButton" class="primary-button landing__start" type="button">เริ่ม</button>
        </div>
        <div class="landing__visual" aria-hidden="true">
          <img class="landing__visual-image" width="660" height="720" alt="" src="../../452492_0.jpg">
        </div>
      </div>
    </section>

    <section id="appPage" class="view app-page" aria-labelledby="appTitle" hidden>
      <div class="app-main-card">
        <header class="app-header">
          <h1 id="appTitle" class="app-header__title" tabindex="-1">พื้นที่แรเงาบนแผนภาพเวนน์</h1>
        </header>

        <main id="contentGrid" class="app-content">
          <div id="appLayout" class="app-layout">
            <div class="venn-app">
              <aside class="venn-sidebar" aria-label="ตัวเลือกเซต">
                <p class="venn-sidebar__label" id="modeLabel">โหมด</p>
                <div id="modeToggle" class="seg" role="radiogroup" aria-labelledby="modeLabel">
                  <button id="btnExplore" class="seg__btn is-active" type="button" role="radio" aria-checked="true">สำรวจ</button>
                  <button id="btnShade" class="seg__btn" type="button" role="radio" aria-checked="false">แรเงา</button>
                </div>

                <p class="venn-sidebar__label" id="setsLabel">จำนวนเซต</p>
                <div id="setToggle" class="seg" role="radiogroup" aria-labelledby="setsLabel">
                  <button id="btnTwo" class="seg__btn is-active" type="button" role="radio" aria-checked="true">2 เซต</button>
                  <button id="btnThree" class="seg__btn" type="button" role="radio" aria-checked="false">3 เซต</button>
                </div>

                <div id="exploreControls" class="mode-panel">
                  <p id="hintBox" class="venn-hint">เลือกที่แผนภาพ<br>เพื่อแรเงาหรือยกเลิก</p>
                  <label class="write-toggle" for="writeToggle">
                    <input id="writeToggle" type="checkbox" />
                    <span id="writeToggleLabel">เขียนเซต</span>
                  </label>
                </div>

                <div id="shadeControls" class="mode-panel" hidden>
                  <p class="venn-sidebar__label shade-builder__label" id="tilesLabel">สร้างนิพจน์ด้วยแผ่นป้าย</p>
                  <div id="tilePalette" class="tile-palette" role="group" aria-labelledby="tilesLabel"></div>
                </div>
              </aside>

              <section class="venn-stage" aria-label="แผนภาพเวนน์">
                <button id="resetButton" class="venn-reset" type="button" aria-label="ล้างแรเงา" title="ล้างแรเงา">
                  <svg class="venn-reset__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                    <path d="M21 12a9 9 0 1 1-3-6.7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M21 3v6h-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
                <div id="vennCanvas" class="venn-canvas"></div>
              </section>

              <section id="vennResult" class="venn-result" aria-live="polite">
                <div id="exploreResultPanel" class="result-box">
                  <span id="resultLead" class="result-box__lead"></span>
                  <span id="resultMath" class="result-box__math"></span>
                </div>

                <div id="shadeResultPanel" class="shade-bar" hidden>
                  <p id="exprError" class="expr-error" role="alert" hidden>เขียนเซตไม่ถูกต้องตามหลักการ</p>
                  <div class="shade-bar__body">
                    <div class="shade-bar__expr">
                      <div class="shade-bar__line">
                        <span id="exprLabel" class="shade-bar__label">นิพจน์ :</span>
                        <div id="exprLine" class="expr-line" role="list" aria-labelledby="exprLabel"></div>
                      </div>
                      <div id="shadeResultLine" class="shade-bar__line shade-bar__line--result" hidden>
                        <span id="shadeResultLead" class="shade-bar__result-lead"></span>
                        <span id="shadeResultMath" class="shade-bar__result-math"></span>
                      </div>
                    </div>
                    <div class="shade-bar__actions">
                      <button id="exprBackspace" class="shade-icon-btn" type="button" aria-label="ลบ" title="ลบ">
                        <svg class="shade-icon-btn__svg" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                          <path d="M8.5 5.5H20a1.5 1.5 0 0 1 1.5 1.5v10A1.5 1.5 0 0 1 20 18.5H8.5L3.2 12.8a1.2 1.2 0 0 1 0-1.6L8.5 5.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                          <path d="M11.2 9.2l5.6 5.6M16.8 9.2l-5.6 5.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                        </svg>
                      </button>
                      <button id="exprClear" class="shade-icon-btn" type="button" aria-label="ล้างนิพจน์" title="ล้างนิพจน์">
                        <span class="shade-icon-btn__letter" aria-hidden="true">C</span>
                      </button>
                      <button id="shadeApplyBtn" class="shade-apply-btn" type="button">แรเงา</button>
                    </div>
                  </div>
                </div>
              </section>
            </div>
          </div>
        </main>
      </div>
    </section>
  </div>
</body>
</html>
