<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>สับเซตและพาวเวอร์เซต</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script defer src="content.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <div class="site-shell">
    <section id="landingPage" class="view view--active landing" aria-labelledby="landingTitle">
      <div class="landing__frame">
        <div class="landing__copy">
          <p id="landingEyebrow" class="eyebrow">INTERACTIVE MATHEMATICS</p>
          <h1 id="landingTitle" class="landing__title">สับเซตและพาวเวอร์เซต</h1>
          <button id="startButton" class="primary-button landing__start" type="button">เริ่ม</button>
        </div>
        <div class="landing__visual" id="landingVisual">
          <img
            class="landing__visual-image"
            src="../../452492_0.jpg"
            width="853"
            height="552"
            alt=""
            onerror="this.closest('.landing__visual')?.classList.add('landing__visual--empty')"
          >
        </div>
      </div>
    </section>

    <section id="appPage" class="view app-page" aria-labelledby="appTitle" hidden>
      <div class="app-main-card">
        <header class="app-header">
          <div>
            <p id="appEyebrow" class="app-header__eyebrow">INTERACTIVE LESSON</p>
            <h1 id="appTitle" class="app-header__title" tabindex="-1">สับเซตและพาวเวอร์เซต</h1>
          </div>
        </header>

        <main id="contentGrid" class="app-content">
          <div id="appLayout" class="app-layout"></div>
        </main>
      </div>
    </section>
  </div>
</body>
</html>
