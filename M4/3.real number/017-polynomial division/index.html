<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>การหารพหุนาม | Interactive Mathematics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script defer src="content.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <div class="site-shell">
    <section id="landingPage" class="view view--active landing" aria-labelledby="landingTitle">
      <div class="landing__frame">
        <div class="landing__copy">
          <p id="landingEyebrow" class="eyebrow">INTERACTIVE MATHEMATICS</p>
          <div class="landing__title-block">
            <h1 id="landingTitle" class="landing__title">การหารพหุนาม</h1>
            <button id="startButton" class="primary-button landing__start" type="button">เริ่ม</button>
          </div>
        </div>
        <div class="landing__visual" aria-hidden="true">
          <img
            class="landing__visual-image"
            src="assets/picture/landing-cover.png"
            alt=""
            width="1200"
            height="1310"
            decoding="async"
            onerror="this.hidden=true;this.parentElement?.classList.add('landing__visual--empty');"
          >
        </div>
      </div>
    </section>

    <section id="appPage" class="view app-page" aria-labelledby="appTitle" hidden>
      <div class="app-main-card">
        <header class="app-header">
          <h1 id="appTitle" class="app-header__title" tabindex="-1">การหารพหุนาม</h1>
        </header>

        <main id="contentGrid" class="app-content">
          <div id="appLayout" class="app-layout div-app">
            <section class="div-define" aria-labelledby="defineLabel">
              <h2 id="defineLabel" class="div-section-label">กำหนดพหุนาม</h2>

              <div class="div-input-block">
                <div class="div-grid" role="group" aria-label="สัมประสิทธิ์ของพหุนาม">
                  <div class="div-grid__corner" aria-hidden="true"></div>
                  <div class="div-grid__head">$x^4$</div>
                  <div class="div-grid__head">$x^3$</div>
                  <div class="div-grid__head">$x^2$</div>
                  <div class="div-grid__head">$x$</div>
                  <div class="div-grid__head">$c$</div>

                  <div class="div-grid__name">$P(x)$</div>
                  <input class="div-coeff" id="p4" type="text" inputmode="numeric" data-poly="p" data-deg="4" maxlength="5" aria-label="สัมประสิทธิ์ของ x^4 ใน P(x)" value="">
                  <input class="div-coeff" id="p3" type="text" inputmode="numeric" data-poly="p" data-deg="3" maxlength="5" aria-label="สัมประสิทธิ์ของ x^3 ใน P(x)" value="1">
                  <input class="div-coeff" id="p2" type="text" inputmode="numeric" data-poly="p" data-deg="2" maxlength="5" aria-label="สัมประสิทธิ์ของ x^2 ใน P(x)" value="-1">
                  <input class="div-coeff" id="p1" type="text" inputmode="numeric" data-poly="p" data-deg="1" maxlength="5" aria-label="สัมประสิทธิ์ของ x ใน P(x)" value="-5">
                  <input class="div-coeff" id="p0" type="text" inputmode="numeric" data-poly="p" data-deg="0" maxlength="5" aria-label="พจน์คงที่ของ P(x)" value="-3">

                  <div class="div-grid__name">$Q(x)$</div>
                  <span class="div-grid__spacer" aria-hidden="true"></span>
                  <span class="div-grid__spacer" aria-hidden="true"></span>
                  <input class="div-coeff" id="q2" type="text" inputmode="numeric" data-poly="q" data-deg="2" maxlength="5" aria-label="สัมประสิทธิ์ของ x^2 ใน Q(x)" value="">
                  <input class="div-coeff" id="q1" type="text" inputmode="numeric" data-poly="q" data-deg="1" maxlength="5" aria-label="สัมประสิทธิ์ของ x ใน Q(x)" value="1">
                  <input class="div-coeff" id="q0" type="text" inputmode="numeric" data-poly="q" data-deg="0" maxlength="5" aria-label="พจน์คงที่ของ Q(x)" value="-3">
                </div>

                <div class="div-previews" aria-live="polite">
                  <div id="pPreview" class="div-preview"></div>
                  <div id="qPreview" class="div-preview"></div>
                </div>

                <button id="infoBtn" class="info-btn" type="button" aria-label="ข้อมูลขั้นตอนวิธีการหาร" title="ข้อมูลขั้นตอนวิธีการหาร" aria-haspopup="dialog" aria-controls="infoModal">
                  <span class="info-btn__glyph" aria-hidden="true">i</span>
                </button>
              </div>
            </section>

            <section class="div-method" aria-labelledby="methodLabel">
              <div class="div-method__row">
                <p id="divideLabel" class="div-divide-label">หารพหุนาม $P(x)$ ด้วย $Q(x)$</p>
                <h2 id="methodLabel" class="div-section-label">เลือกวิธีการหาร</h2>
                <div class="div-method__list" role="radiogroup" aria-labelledby="methodLabel">
                  <label class="div-method__opt">
                    <input type="radio" name="method" value="long" checked>
                    <span>หารยาว</span>
                  </label>
                  <label class="div-method__opt">
                    <input type="radio" name="method" value="synth">
                    <span>หารสังเคราะห์</span>
                  </label>
                </div>
              </div>
            </section>

            <section id="workBox" class="div-work" aria-live="polite" aria-label="ขั้นตอนการหาร">
              <button id="workReset" class="stage-reset" type="button" aria-label="รีเฟรช" title="รีเฟรช">
                <svg class="stage-reset__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                  <path d="M21 12a9 9 0 1 1-3-6.7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M21 3v6h-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
              <div id="workBody" class="div-work__body"></div>
              <div class="div-work__footer">
                <div id="workConclusion" class="div-work__conclusion"></div>
                <div class="div-nav" role="group" aria-label="ควบคุมขั้นตอน">
                  <button id="prevBtn" class="proof-btn proof-btn--accent" type="button" disabled>ก่อนหน้า</button>
                  <button id="nextBtn" class="proof-btn proof-btn--accent" type="button">ถัดไป</button>
                  <button id="allBtn" class="proof-btn proof-btn--accent" type="button">ทั้งหมด</button>
                </div>
              </div>
            </section>
          </div>
        </main>
      </div>
    </section>
  </div>

  <div id="infoModal" class="info-modal" hidden role="dialog" aria-modal="true" aria-labelledby="infoTitle">
    <div class="info-modal__backdrop" data-close="1"></div>
    <div class="info-modal__panel">
      <button id="infoCloseBtn" class="modal__close" type="button" aria-label="ปิด">&times;</button>
      <h2 id="infoTitle" class="info-modal__title"></h2>
      <div id="infoBody" class="info-modal__body"></div>
    </div>
  </div>
</body>
</html>
