<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>พหุนามตัวแปรเดียว | Interactive Mathematics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script defer src="content.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <div class="site-shell">
    <section id="landingPage" class="view view--active landing" aria-labelledby="landingTitle">
      <div class="landing__frame">
        <div class="landing__copy">
          <p id="landingEyebrow" class="eyebrow">INTERACTIVE MATHEMATICS</p>
          <div class="landing__title-block">
            <h1 id="landingTitle" class="landing__title">พหุนามตัวแปรเดียว</h1>
            <button id="startButton" class="primary-button landing__start" type="button">เริ่ม</button>
          </div>
        </div>
        <div class="landing__visual" aria-hidden="true">
          <img
            class="landing__visual-image"
            src="assets/picture/landing-cover.png"
            alt=""
            width="1200"
            height="1310"
            decoding="async"
            onerror="this.hidden=true;this.parentElement?.classList.add('landing__visual--empty');"
          >
        </div>
      </div>
    </section>

    <section id="appPage" class="view app-page" aria-labelledby="appTitle" hidden>
      <div class="app-main-card">
        <header class="app-header">
          <h1 id="appTitle" class="app-header__title" tabindex="-1">พหุนามตัวแปรเดียว</h1>
        </header>

        <main id="contentGrid" class="app-content">
          <div id="appLayout" class="app-layout poly-app">
            <section class="poly-define" aria-labelledby="defineLabel">
              <h2 id="defineLabel" class="poly-section-label">กำหนดพหุนาม</h2>

              <div class="poly-input-block">
                <div class="poly-grid" role="group" aria-label="สัมประสิทธิ์ของพหุนาม">
                  <div class="poly-grid__corner" aria-hidden="true"></div>
                  <div class="poly-grid__head">$x^3$</div>
                  <div class="poly-grid__head">$x^2$</div>
                  <div class="poly-grid__head">$x$</div>
                  <div class="poly-grid__head">$c$</div>

                  <div class="poly-grid__name">$P(x)$</div>
                  <input class="poly-coeff" id="p3" type="text" inputmode="numeric" data-poly="p" data-deg="3" maxlength="5" aria-label="สัมประสิทธิ์ของ x^3 ใน P(x)" value="3">
                  <input class="poly-coeff" id="p2" type="text" inputmode="numeric" data-poly="p" data-deg="2" maxlength="5" aria-label="สัมประสิทธิ์ของ x^2 ใน P(x)" value="0">
                  <input class="poly-coeff" id="p1" type="text" inputmode="numeric" data-poly="p" data-deg="1" maxlength="5" aria-label="สัมประสิทธิ์ของ x ใน P(x)" value="2">
                  <input class="poly-coeff" id="p0" type="text" inputmode="numeric" data-poly="p" data-deg="0" maxlength="5" aria-label="พจน์คงที่ของ P(x)" value="-1">

                  <div class="poly-grid__name">$Q(x)$</div>
                  <input class="poly-coeff" id="q3" type="text" inputmode="numeric" data-poly="q" data-deg="3" maxlength="5" aria-label="สัมประสิทธิ์ของ x^3 ใน Q(x)" value="0">
                  <input class="poly-coeff" id="q2" type="text" inputmode="numeric" data-poly="q" data-deg="2" maxlength="5" aria-label="สัมประสิทธิ์ของ x^2 ใน Q(x)" value="-1">
                  <input class="poly-coeff" id="q1" type="text" inputmode="numeric" data-poly="q" data-deg="1" maxlength="5" aria-label="สัมประสิทธิ์ของ x ใน Q(x)" value="4">
                  <input class="poly-coeff" id="q0" type="text" inputmode="numeric" data-poly="q" data-deg="0" maxlength="5" aria-label="พจน์คงที่ของ Q(x)" value="5">
                </div>

                <div class="poly-previews" aria-live="polite">
                  <div id="pPreview" class="poly-preview"></div>
                  <div id="qPreview" class="poly-preview"></div>
                </div>
              </div>
            </section>

            <section class="poly-ops" aria-labelledby="opsLabel">
              <h2 id="opsLabel" class="poly-section-label">เลือกการดำเนินการเพื่อศึกษา</h2>
              <div class="poly-ops__list" role="radiogroup" aria-labelledby="opsLabel">
                <label class="poly-op">
                  <input type="radio" name="operation" value="add">
                  <span class="poly-op__text">$P(x) + Q(x)$</span>
                </label>
                <label class="poly-op">
                  <input type="radio" name="operation" value="sub">
                  <span class="poly-op__text">$P(x) - Q(x)$</span>
                </label>
                <label class="poly-op">
                  <input type="radio" name="operation" value="mul">
                  <span class="poly-op__text">$P(x) \cdot Q(x)$</span>
                </label>
              </div>
            </section>

            <section id="workBox" class="poly-work" aria-live="polite" aria-label="ขั้นตอนการคำนวณ">
              <div id="workBody" class="poly-work__body"></div>
            </section>
          </div>
        </main>
      </div>
    </section>
  </div>
</body>
</html>
