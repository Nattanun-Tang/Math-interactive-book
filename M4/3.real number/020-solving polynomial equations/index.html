<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>การแก้สมการพหุนามตัวแปรเดียว | Interactive Mathematics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script defer src="content.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <div class="site-shell">
    <section id="landingPage" class="view view--active landing" aria-labelledby="landingTitle">
      <div class="landing__frame">
        <div class="landing__copy">
          <p id="landingEyebrow" class="eyebrow">INTERACTIVE MATHEMATICS</p>
          <div class="landing__title-block">
            <h1 id="landingTitle" class="landing__title">การแก้สมการพหุนามตัวแปรเดียว</h1>
            <button id="startButton" class="primary-button landing__start" type="button">เริ่ม</button>
          </div>
        </div>
        <div class="landing__visual" aria-hidden="true">
          <img
            class="landing__visual-image"
            src="assets/picture/landing-cover.png"
            alt=""
            width="1200"
            height="1310"
            decoding="async"
            onerror="this.hidden=true;this.parentElement?.classList.add('landing__visual--empty');"
          >
        </div>
      </div>
    </section>

    <section id="appPage" class="view app-page" aria-labelledby="appTitle" hidden>
      <div class="app-main-card">
        <header class="app-header">
          <h1 id="appTitle" class="app-header__title" tabindex="-1">การแก้สมการพหุนามตัวแปรเดียว</h1>
        </header>

        <main id="contentGrid" class="app-content">
          <div id="appLayout" class="app-layout solve-app">
            <div class="toolbar">
              <div class="toolbar__left">
                <div class="mode-bar" role="group" aria-labelledby="modeLabel">
                  <span id="modeLabel" class="toolbar__label">โหมด</span>
                  <div class="mode-toggle">
                    <button id="modeLearnBtn" class="mode-btn mode-btn--active" type="button" data-mode="learn" aria-pressed="true">ศึกษา</button>
                    <button id="modeTestBtn" class="mode-btn" type="button" data-mode="test" aria-pressed="false">ทดสอบ</button>
                  </div>
                </div>
                <div class="method-bar">
                  <span id="methodLabel" class="toolbar__label">แก้สมการโดย</span>
                  <label class="visually-hidden" for="methodSelect">เลือกวิธีการแก้สมการ</label>
                  <select id="methodSelect" class="category-select"></select>
                </div>
              </div>
              <button id="infoBtn" class="info-btn" type="button" aria-label="สูตรที่เกี่ยวข้อง" title="สูตรที่เกี่ยวข้อง" aria-haspopup="dialog" aria-controls="infoModal">
                <span class="info-btn__glyph" aria-hidden="true">i</span>
              </button>
            </div>

            <section id="learnPanel" class="panel panel--learn" aria-label="โหมดศึกษา">
              <div class="pager" aria-label="เลือกตัวอย่าง">
                <span id="pagerLabel" class="pager__label">ข้อ 1/5</span>
                <div class="pager__controls" role="group" aria-label="เลื่อนข้อ">
                  <button id="pagerPrev" class="pager__arrow" type="button" aria-label="ข้อก่อนหน้า" disabled>&lt;</button>
                  <div id="pagerDots" class="pager__dots"></div>
                  <button id="pagerNext" class="pager__arrow" type="button" aria-label="ข้อถัดไป">&gt;</button>
                </div>
              </div>

              <article id="learnCard" class="work-card" aria-live="polite">
                <div id="learnBody" class="work-card__body"></div>
              </article>
            </section>

            <section id="testPanel" class="panel panel--test" aria-label="โหมดทดสอบ" hidden>
              <article class="work-card work-card--test">
                <div class="test-toolbar">
                  <button id="testReset" class="stage-reset" type="button" aria-label="รีเฟรช" title="รีเฟรช">
                    <svg class="stage-reset__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                      <path d="M21 12a9 9 0 1 1-3-6.7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                      <path d="M21 3v6h-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </button>
                </div>

                <div class="prompt-row">
                  <p id="testPrompt" class="prompt-line"></p>
                  <button id="randomBtn" class="action-btn action-btn--accent" type="button">สุ่มโจทย์</button>
                </div>

                <div id="testBody" class="work-card__body test-steps" aria-live="polite"></div>

                <div class="test-actions">
                  <div class="work-nav" role="group" aria-label="ควบคุมขั้นตอน">
                    <button id="prevBtn" class="proof-btn proof-btn--accent" type="button" disabled>ก่อนหน้า</button>
                    <button id="nextBtn" class="proof-btn proof-btn--accent" type="button" disabled>ถัดไป</button>
                    <button id="allBtn" class="proof-btn proof-btn--accent" type="button" aria-pressed="false" disabled>ทั้งหมด</button>
                  </div>
                </div>
              </article>
            </section>
          </div>
        </main>
      </div>
    </section>
  </div>

  <div id="infoModal" class="info-modal" hidden role="dialog" aria-modal="true" aria-labelledby="infoTitle">
    <div class="info-modal__backdrop" data-close="1"></div>
    <div class="info-modal__panel">
      <button id="infoCloseBtn" class="modal__close" type="button" aria-label="ปิด">&times;</button>
      <h2 id="infoTitle" class="info-modal__title">สูตรที่เกี่ยวข้อง</h2>
      <div id="infoBody" class="info-modal__body"></div>
    </div>
  </div>
</body>
</html>
